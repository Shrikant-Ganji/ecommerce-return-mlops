name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with pytest
        run: pytest tests/

      - name: 💅 Lint code with flake8
        run: flake8 src/ pipelines/ tests/ deployment/

      - name: 🎨 Check formatting with black
        run: black --check .

  docker-build-push:
    needs: build-test-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Build Docker image
        run: docker build -t ecommerce-return-app .

      - name: 🔖 Tag Docker image for GHCR
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_ACTOR,,}/ecommerce-return-app:latest"
          docker tag ecommerce-return-app "$IMAGE_NAME"

      - name: 🔐 Login to GitHub Container Registry (GHCR)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo $GHCR_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 📤 Push Docker image to GHCR
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_ACTOR,,}/ecommerce-return-app:latest"
          docker push "$IMAGE_NAME"

